name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

# Artifacts are published for manual download — there is no in-app updater.

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install pinned dependencies
        run: |
          python -m pip install -U pip
          pip install -r requirements-release.txt
          pip install -e .
      - name: Install Linux GUI libs
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libxkbcommon0 libxcb-cursor0
      - name: Test
        env:
          QT_QPA_PLATFORM: offscreen
          PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
        run: |
          python -m pytest -p pytestqt
      - name: Dependency vulnerability scan
        run: |
          python -m pip install pip-audit
          pip-audit -r requirements-release.txt

  build-linux:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: |
          python -m pip install -U pip
          pip install -r requirements-release.txt
          pip install -e .
          sudo apt-get update
          sudo apt-get install -y libegl1 libxkbcommon0 libxcb-cursor0
          bash scripts/build_linux.sh
          bash scripts/verify_offline.sh
      - name: Checksum
        run: |
          cd dist && tar -czf justconvertit-linux-x86_64.tar.gz justconvertit
          sha256sum justconvertit-linux-x86_64.tar.gz > ../justconvertit-linux.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: justconvertit-linux
          path: |
            dist/justconvertit-linux-x86_64.tar.gz
            justconvertit-linux.sha256

  build-windows:
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --no-progress -y
      - name: Build app + Setup.exe
        shell: pwsh
        run: |
          python -m pip install -U pip
          pip install -r requirements-release.txt
          pip install -e .
          pip install pyinstaller
          pyinstaller --noconfirm --clean packaging/windows/omniconvert.spec
          $exe = ".\dist\justconvertit\justconvertit.exe"
          if (-not (Test-Path $exe)) { throw "missing $exe" }
          $in = Join-Path $env:TEMP "oc-in.png"
          $out = Join-Path $env:TEMP "oc-out.jpg"
          if (Test-Path $out) { Remove-Item -Force $out }
          python -c "from PIL import Image; Image.new('RGB',(8,8),(1,2,3)).save(r'$in')"
          # GUI subsystem EXE must be Wait'ed; `&` returns too early on Windows.
          $p = Start-Process -FilePath $exe `
            -ArgumentList @("--smoke-convert", "image.png_to_jpeg", $in, $out) `
            -Wait -PassThru -NoNewWindow
          if ($null -ne $p.ExitCode -and $p.ExitCode -ne 0) {
            throw "smoke-convert exit code $($p.ExitCode)"
          }
          $deadline = (Get-Date).AddSeconds(45)
          while (-not (Test-Path $out) -and (Get-Date) -lt $deadline) {
            Start-Sleep -Milliseconds 250
          }
          if (-not (Test-Path $out)) { throw "smoke output missing" }
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { $iscc = "${env:ProgramFiles}\Inno Setup 6\ISCC.exe" }
          if (-not (Test-Path $iscc)) { throw "ISCC.exe not found after choco install" }
          & $iscc packaging\windows\installer.iss
          if ($LASTEXITCODE -ne 0) { throw "Inno Setup compile failed" }
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Copy-Item -Force packaging\windows\Output\JustConvertIt-0.1.0-Setup.exe dist\JustConvertIt-0.1.0-Setup.exe
          Get-FileHash dist\JustConvertIt-0.1.0-Setup.exe -Algorithm SHA256 |
            ForEach-Object { "$($_.Hash.ToLower())  JustConvertIt-0.1.0-Setup.exe" } |
            Set-Content -Encoding ascii dist\JustConvertIt-0.1.0-Setup.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: justconvertit-windows-setup
          path: |
            dist/JustConvertIt-0.1.0-Setup.exe
            dist/JustConvertIt-0.1.0-Setup.sha256
            dist/justconvertit
